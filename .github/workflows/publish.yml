name: Build & Publish NEXUS to RootApp

on:
  workflow_dispatch:
    inputs:
      authToken:
        description: "RootApp Production Auth Token"
        required: true
        type: string
      host:
        description: "Target Host (e.g. dev.rootapp.com or live)"
        required: false
        default: "dev.rootapp.com"
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Compile TypeScript
        run: npm run build

      - name: Package Bot
        run: npx rootsdk build package --output-file ./rootapp.pkg --project-folder .

      - name: Upload Package to RootApp
        env:
          AUTH_TOKEN: ${{ inputs.authToken || secrets.ROOTAPP_AUTH_TOKEN }}
          HOST: ${{ inputs.host || 'dev.rootapp.com' }}
        run: |
          npx rootsdk upload package \
            --file ./rootapp.pkg \
            --authToken "$AUTH_TOKEN" \
            --host "$HOST"
