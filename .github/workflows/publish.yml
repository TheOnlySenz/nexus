name: Build & Publish NEXUS to RootApp

on:
  workflow_dispatch:
    inputs:
      authToken:
        description: "RootApp Authentication Token (from Developer Portal)"
        required: false
        type: string
      host:
        description: "Optional custom host (leave empty for default Root production cloud)"
        required: false
        default: ""
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Compile TypeScript
        run: npm run build

      - name: Package Bot
        run: npx rootsdk build package --output-file ./rootapp.pkg --project-folder .

      - name: Upload Package as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootapp-package
          path: ./rootapp.pkg

      - name: Upload Package to RootApp
        if: ${{ inputs.authToken != '' || env.SECRET_AUTH_TOKEN != '' }}
        env:
          AUTH_TOKEN: ${{ inputs.authToken }}
          SECRET_AUTH_TOKEN: ${{ secrets.ROOTAPP_AUTH_TOKEN }}
          HOST: ${{ inputs.host }}
        run: |
          TOKEN="${AUTH_TOKEN:-$SECRET_AUTH_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No auth token provided; skipping cloud upload. You can download rootapp.pkg from artifacts."
            exit 0
          fi

          if [ -n "$HOST" ]; then
            echo "Uploading with custom host: $HOST"
            npx rootsdk upload package --file ./rootapp.pkg --authToken "$TOKEN" --host "$HOST"
          else
            echo "Uploading to standard Root cloud..."
            npx rootsdk upload package --file ./rootapp.pkg --authToken "$TOKEN"
          fi
